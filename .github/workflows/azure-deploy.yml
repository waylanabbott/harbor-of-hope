name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: harbor-of-hope
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Frontend build ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Vite outputs directly to backend/HarborOfHope.API/wwwroot (see vite.config.ts)

      # ── Backend build ──
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend dependencies
        run: dotnet restore
        working-directory: backend/HarborOfHope.API

      - name: Publish backend
        run: dotnet publish -c Release -o ./publish
        working-directory: backend/HarborOfHope.API

      # ── Deploy via Zip Deploy using basic auth ──
      - name: Create zip package
        run: cd backend/HarborOfHope.API/publish && zip -r /tmp/deploy.zip .

      - name: Deploy to Azure Web App
        run: |
          curl -s -X POST \
            "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zipdeploy" \
            -u "${{ secrets.AZURE_DEPLOY_USERNAME }}:${{ secrets.AZURE_DEPLOY_PASSWORD }}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/deploy.zip \
            -w "\nHTTP %{http_code}\n" \
            -o /tmp/deploy-response.txt
          cat /tmp/deploy-response.txt
